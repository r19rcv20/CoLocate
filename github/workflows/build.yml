name: Build CoLocate Windows Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Compiling Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pypdf python-docx pyinstaller

    - name: Generate Standalone Executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --name="CoLocate" --icon="icon.ico" --collect-all customtkinter app.py

    - name: Save Compiled Executable Package
      uses: actions/upload-artifact@v4
      with:
        name: CoLocate_Windows_EXE
        path: dist/CoLocate.exe
